name: Build & Release Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-mobile-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: 5. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 6. Install Monorepo Dependencies
        run: pnpm install

      - name: 7. Generate Android Native Project (Expo Prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: 8. Setup Build Permissions
        run: chmod +x apps/mobile/android/gradlew

      - name: 9. Build Android APK with Gradle
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 10. Prepare APK Asset for Release
        run: |
          mkdir -p build-output
          # Recherche de l'APK généré
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Erreur : Aucun fichier APK trouvé !"
            exit 1
          fi
          echo "✅ Fichier APK trouvé : $APK_PATH"
          cp "$APK_PATH" build-output/allotech-technicien.apk
          ls -la build-output/

      - name: 11. Upload Artifact in Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: allotech-technicien-apk
          path: build-output/allotech-technicien.apk
          if-no-files-found: error
          retention-days: 30

      - name: 12. Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest
          name: "AlloTech Technicien Mobile (APK)"
          body: |
            ## 📱 AlloTech Technicien Mobile — Application Terrain Android

            Dernière version de l'application mobile pour les techniciens AlloTech.

            ### 🚀 Comment installer l'application sur votre smartphone Android :
            1. Téléchargez le fichier **`allotech-technicien.apk`** ci-dessous.
            2. Ouvrez le fichier téléchargé sur votre smartphone.
            3. Si demandé, autorisez l'installation d'applications depuis cette source (Paramètres Android).
            4. Ouvrez l'application et connectez-vous avec votre matricule (ex: `TEC-001`) et votre mot de passe.
          files: build-output/allotech-technicien.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
