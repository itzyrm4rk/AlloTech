name: CI AlloTech

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Biome Lint & Format Check
        run: pnpm run check:ci

      - name: Check TypeScript Types
        run: pnpm run check-types

      - name: Run Unit Tests (Vitest)
        run: pnpm --filter @allotech/api exec vitest run --reporter=verbose
        env:
          NODE_ENV: test

      - name: Build Web Application
        run: pnpm --filter web build
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/allotech'
          BETTER_AUTH_SECRET: 'allotech-ci-dummy-auth-secret-key-32chars'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
